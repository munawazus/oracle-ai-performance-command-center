name: CI

on:
  push:
    # This repo's actual default branch is master, not main - CI never once fired on a
    # push before this was corrected (found live, connecting CI for the first time ever;
    # see docs/ENTERPRISE_READINESS_PLAN.md Phase A.2).
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ocmd
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ocmd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ocmd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check app tests --line-length 110
      - name: Type check (mypy)
        run: python -m mypy app --ignore-missing-imports
      - name: Security lint (bandit)
        run: python -m bandit -q -r app
      - name: Dependency vulnerability scan (pip-audit)
        run: python -m pip_audit -r requirements.txt
      - name: Unit + component tests (SQLite/fakeredis doubles)
        run: python -m pytest -q
      - name: Integration tests (real Postgres + Redis)
        working-directory: .
        env:
          DATABASE_URL: postgresql+asyncpg://ocmd:ci_test_password@localhost:5432/ocmd
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install -r backend/requirements-dev.txt
          PYTHONPATH=backend python -m pytest tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit + component tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
